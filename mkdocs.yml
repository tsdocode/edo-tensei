site_name: Edo Tensei
site_description: Live checkpoint and restore for AI workloads
site_url: https://tsdocode.github.io/edo-tensei/
repo_url: https://github.com/tsdocode/edo-tensei
repo_name: tsdocode/edo-tensei

docs_dir: docs
theme:
  name: material
  language: en
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-night
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono
  favicon: assets/edo-tensei-banner.jpg

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/tsdocode/edo-tensei
  generator: false

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Release notes:
      - v0.1.0: releases/v0.1.0.md
  - Concepts:
      - Architecture: concepts/architecture.md
      - Compatibility: compatibility.md
  - Guides:
      - CLI reference: cli.md
      - Troubleshooting: troubleshooting.md
      - Migration: migration.md
  - Integrations:
      - FastAPI: integrations/fastapi.md
      - PyTorch: integrations/pytorch.md
      - vLLM: integrations/vllm.md
      - CUDA: integrations/cuda.md
      - Triton: integrations/triton.md
      - Kubernetes: integrations/kubernetes.md

plugins:
  - search
