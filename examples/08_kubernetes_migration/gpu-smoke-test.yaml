apiVersion: v1
kind: Pod
metadata:
  name: edo-gpu-smoke
  namespace: edo-system
  labels:
    app: edo-gpu-smoke
spec:
  restartPolicy: Never
  runtimeClassName: nvidia
  containers:
    - name: cuda
      image: nvidia/cuda:12.8.1-base-ubuntu24.04
      command: ["nvidia-smi"]
      resources:
        limits:
          nvidia.com/gpu: 1
