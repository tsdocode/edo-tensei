name: CI

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo check --all-targets
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-targets
      - run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: edo-linux-x86_64
          path: target/release/edo

  cpu-demo:
    # Build a recent CRIU because Ubuntu 22.04's packaged CRIU can segfault
    # while restoring Python workloads on the hosted runner kernel.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install CRIU
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            asciidoc \
            build-essential \
            git \
            iproute2 \
            libcap-dev \
            libgnutls28-dev \
            libnet1-dev \
            libnl-3-dev \
            libnl-route-3-dev \
            libprotobuf-c-dev \
            libprotobuf-dev \
            libunwind-dev \
            protobuf-c-compiler \
            protobuf-compiler \
            python3-protobuf
          git clone --depth 1 --branch v4.2.1 https://github.com/checkpoint-restore/criu.git "$RUNNER_TEMP/criu"
          make -C "$RUNNER_TEMP/criu" -j2
          sudo make -C "$RUNNER_TEMP/criu" install
          criu --version
      - name: Validate demo scripts
        run: |
          bash tests/validate-demos.sh
      - name: Run CPU resume smoke test
        run: cargo run --example resume
