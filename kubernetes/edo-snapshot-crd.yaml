apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: edosnapshots.edo.tensei.dev
spec:
  group: edo.tensei.dev
  scope: Namespaced
  names:
    plural: edosnapshots
    singular: edosnapshot
    kind: EdoSnapshot
    shortNames: [edockpt]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [workload, container]
              properties:
                workload: { type: string }
                container: { type: string }
                nodeName: { type: string }
                storagePath: { type: string }
                readinessURL: { type: string }
                cudaPids:
                  type: array
                  items: { type: integer, format: int32 }
            status:
              type: object
              properties:
                phase: { type: string }
                message: { type: string }
                artifact: { type: string }
      subresources:
        status: {}
