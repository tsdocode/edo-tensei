apiVersion: v1
kind: Pod
metadata:
  name: edo-vllm-restore-placeholder
  namespace: edo-system
  labels:
    app: edo-vllm-restore-placeholder
spec:
  restartPolicy: Never
  runtimeClassName: nvidia
  containers:
    - name: vllm
      image: vllm-local:cuda12.8
      imagePullPolicy: IfNotPresent
      command: ["/bin/sh", "-c"]
      args: ["exec tail -f /dev/null"]
      resources:
        limits:
          nvidia.com/gpu: 1
      volumeMounts:
        - name: model
          mountPath: /models
          readOnly: true
        - name: snapshots
          mountPath: /var/lib/edo-snapshots
        - name: edo-binaries
          mountPath: /opt/edo/bin
          readOnly: true
        - name: edo-libraries
          mountPath: /opt/edo/lib
          readOnly: true
        - name: vllm-cache
          mountPath: /root/.cache
        - name: triton-cache
          mountPath: /root/.triton
  volumes:
    - name: model
      hostPath:
        path: /home/ubuntu/work/edo-tensei/.models
        type: Directory
    - name: snapshots
      hostPath:
        path: /var/lib/edo-snapshots
        type: DirectoryOrCreate
    - name: edo-binaries
      hostPath:
        path: /opt/edo/bin
        type: Directory
    - name: edo-libraries
      hostPath:
        path: /opt/edo/lib
        type: Directory
    - name: vllm-cache
      hostPath:
        path: /var/lib/edo-vllm-cache
        type: DirectoryOrCreate
    - name: triton-cache
      hostPath:
        path: /var/lib/edo-triton-cache
        type: DirectoryOrCreate
